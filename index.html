<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>html{color-scheme:light}body{margin:0}img{max-width:100%}</style>
<title>Crate DJ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: toolbar of filters on top, crate table left, sticky deck/player panel right. */
:root {
  --bg: #eceef2;
  --surface: #f8f9fb;
  --ink: #15181f;
  --muted: #5b6270;
  --line: #d5d9e1;
  --accent: #3340e0;
  --accent-ink: #ffffff;
  --want: #9a4a06;
  --have: #17703a;
  --danger: #b4231f;
  --f-display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --f-body: "IBM Plex Sans", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1218; --surface: #171b24; --ink: #e8eaf0; --muted: #9199aa; --line: #2a303d;
    --accent: #8c98ff; --accent-ink: #0f1218; --want: #f5b04a; --have: #5fd38d; --danger: #ff8a84;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1218; --surface: #171b24; --ink: #e8eaf0; --muted: #9199aa; --line: #2a303d;
  --accent: #8c98ff; --accent-ink: #0f1218; --want: #f5b04a; --have: #5fd38d; --danger: #ff8a84;
  color-scheme: dark;
}
:root { --yes: #1a9b4b; --maybe: #d69a00; --no: #d6322d; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --yes: #4fd484; --maybe: #f7c948; --no: #ff6b66; } }
:root[data-theme="dark"] { --yes: #4fd484; --maybe: #f7c948; --no: #ff6b66; }
[hidden] { display: none !important; }
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font: 14px/1.45 var(--f-body);
  padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1640px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
header .titlebox { margin-right: 14px; }
.titlebox { display: flex; flex-direction: column; gap: 4px; }
h1 { font: 700 34px/1 var(--f-display); letter-spacing: .02em; text-transform: uppercase; margin: 0; }
.counts { color: var(--muted); font-family: var(--f-mono); font-size: 13px; }
.counts b { color: var(--ink); font-size: 17px; font-weight: 600; }
th.n, td.n { width: 34px; text-align: center; padding: 6px 2px 6px 4px; color: var(--muted); font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.spacer { flex: 1; }
button, input, select, textarea { font: inherit; color: inherit; }
button {
  background: var(--surface); border: 1px solid var(--line); border-radius: 4px;
  padding: 6px 11px; cursor: pointer;
}
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
button.ghost { background: transparent; }
button.danger { color: var(--danger); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input, select, textarea {
  background: var(--surface); border: 1px solid var(--line); border-radius: 4px;
  padding: 6px 8px; min-width: 0; width: 100%;
}
label { display: flex; flex-direction: column; gap: 3px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.filters {
  display: grid; gap: 10px; align-items: end;
  grid-template-columns: minmax(180px, 2fr) repeat(5, minmax(90px, 1fr)) minmax(110px, 1fr) minmax(110px, 1fr) auto;
  padding: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px;
}
.range { display: flex; gap: 6px; }
.range input { padding-inline: 6px; }
.filters-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.main { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 14px; align-items: start; }
.tablebox { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; overflow: auto; max-height: calc(100vh - 230px); min-height: 260px; }
table { border-collapse: collapse; width: 100%; min-width: 780px; table-layout: fixed; }
th, td { padding: 6px 8px; text-align: left; vertical-align: middle; border-bottom: 1px solid var(--line); white-space: nowrap; }
th {
  position: sticky; top: 0; background: var(--surface); z-index: 1;
  font: 600 11px var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
  cursor: pointer; user-select: none;
}
th[aria-sort] { color: var(--ink); }
th .arrow { color: var(--accent); }
td.t, td.tx { white-space: normal; overflow-wrap: anywhere; line-height: 1.25; }
td.t { font-weight: 500; }
td.mono, th.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
tbody tr { cursor: pointer; }
tbody tr:hover { background: color-mix(in srgb, var(--accent) 7%, transparent); }
tbody tr.sel { background: color-mix(in srgb, var(--accent) 16%, transparent); }
.pill { font: 500 11px var(--f-mono); padding: 2px 7px; border-radius: 99px; border: 1px solid currentColor; }
.pill.want { color: var(--want); }
.pill.have { color: var(--have); }
.star { background: none; border: 0; padding: 0 6px; font-size: 19px; line-height: 1; cursor: pointer; }
.star:hover { transform: scale(1.15); }
.star.yes, .star-i.yes { color: var(--yes); }
.star.maybe, .star-i.maybe { color: var(--maybe); }
.star.no, .star-i.no { color: var(--no); }
tbody tr.no td:not(.int) { opacity: .5; }
.seg button.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); }
.seg button { padding-inline: 6px; font-size: 12.5px; }
.cov { width: 64px; height: 64px; border-radius: 4px; object-fit: cover; display: block; }
.cov.ph { background: color-mix(in srgb, var(--muted) 18%, transparent); color: var(--muted); display: grid; place-items: center; font-size: 26px; }
.cov.big { width: 104px; height: 104px; flex: none; }
.cov.big.ph { font-size: 40px; }
th.cv, td.cv { width: 72px; padding: 6px 4px 6px 8px; }
th.c, td.int, td.st { text-align: center; }
.head { display: flex; gap: 12px; align-items: flex-start; }
.head > div { min-width: 0; }
.pltabs { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.pltabs input { width: 190px; }
.pltab { border-radius: 99px; padding: 5px 12px; }
.pltab .n { font-family: var(--f-mono); font-size: 11px; color: var(--muted); margin-left: 6px; }
.pltab.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); font-weight: 600; }
.pltab.add { border-style: dashed; color: var(--muted); }
.pltools { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.plseg > .note { margin-bottom: 4px; }
.bulk select, .bulk input { width: auto; max-width: 200px; }
.datafoot { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; color: var(--muted); font-size: 12.5px; padding-top: 4px; }
.datafoot b { color: var(--ink); font-weight: 600; }
.bulk { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.bulk button:disabled { opacity: .45; cursor: default; }
th.chk, td.chk { width: 34px; padding-right: 0; }
.tablebox:not(.delmode) .chk { display: none; }
input[type="checkbox"] { width: auto; padding: 0; accent-color: var(--accent); cursor: pointer; }
.ex { font: 500 10px var(--f-mono); color: var(--muted); border: 1px dashed var(--muted); border-radius: 3px; padding: 0 4px; margin-left: 6px; }
.empty { padding: 36px 20px; text-align: center; color: var(--muted); display: flex; flex-direction: column; gap: 10px; align-items: center; }
.empty strong { color: var(--ink); font: 700 22px var(--f-display); text-transform: uppercase; letter-spacing: .03em; }
.deck { position: sticky; top: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.deck h2 { font: 700 26px/1.05 var(--f-display); margin: 0; text-transform: uppercase; letter-spacing: .01em; }
.deck .artist { color: var(--muted); margin-top: 2px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.deck { min-width: 0; }
.deck, .deck * { overflow-wrap: anywhere; }
.deck .note { white-space: pre-line; }
.note a { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
.chip { max-width: 100%; }
.embed { display: block; width: 100%; border: 0; border-radius: 6px; background: var(--bg); }
.embed.yt { aspect-ratio: 16 / 9; }
.player { display: flex; flex-direction: column; gap: 6px; }
.ytthumb { display: flex; align-items: center; justify-content: center; background-size: cover; background-position: center; text-decoration: none; color: #fff; }
.ytthumb span { background: rgba(0, 0, 0, .72); padding: 8px 14px; border-radius: 4px; font-weight: 600; }
.chip { font: 500 12px var(--f-mono); border: 1px solid var(--line); border-radius: 3px; padding: 3px 7px; }
.chip.big { font-size: 20px; padding: 6px 10px; color: var(--accent); border-color: var(--accent); }
.deck audio { width: 100%; }
.drop { border: 1px dashed var(--line); border-radius: 4px; padding: 12px; color: var(--muted); font-size: 12.5px; display: flex; flex-direction: column; gap: 8px; }
.drop.over { border-color: var(--accent); color: var(--ink); }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row > * { flex: 1 1 auto; }
a.btn { text-decoration: none; text-align: center; background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 6px 11px; color: var(--ink); }
a.btn:hover { border-color: var(--accent); }
a.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.note { font-size: 12px; color: var(--muted); }
form { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
form .full { grid-column: 1 / -1; }
form textarea { resize: vertical; min-height: 56px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 4px; font-size: 13px; z-index: 20; max-width: calc(100% - 32px); }
@media (max-width: 1100px) {
  .filters { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .filters .q, .filters-actions { grid-column: 1 / -1; }
}
@media (max-width: 860px) {
  .main { grid-template-columns: minmax(0, 1fr); }
  .deck { position: static; order: -1; }
  .tablebox { max-height: 60vh; }
}
@media (max-width: 520px) {
  .filters { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  form { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="titlebox"><h1>Crate</h1>
    <span class="counts" id="counts"></span></div>
    <span class="spacer"></span>
    <button id="btn-add" class="primary">+ Nuovo brano</button>
    <button id="btn-files" type="button" title="Crea un brano per ogni file audio scelto">File audio</button>
    <input id="in-audio" type="file" accept="audio/*" multiple hidden>
    <button id="btn-import" type="button" title="Importa brani da un file CSV o Excel">Importa</button>
    <input id="in-csv" type="file" accept=".csv,.xlsx,.xls,text/csv,text/plain" hidden>
    <button id="btn-export" type="button">Esporta CSV</button>
    <button id="btn-xlsx" type="button">Esporta Excel</button>
    <button id="btn-delmode" type="button">Seleziona…</button>
  </header>

  <section class="filters" aria-label="Filtri">
    <label class="q">Cerca
      <input id="f-q" type="search" placeholder="Titolo, artista, etichetta, note">
    </label>
    <label>Genere <select id="f-genre"></select></label>
    <label>Tonalità <select id="f-key"></select></label>
    <label>Stato
      <select id="f-status">
        <option value="">Tutti</option>
        <option value="want">Da comprare</option>
        <option value="have">Comprati</option>
      </select>
    </label>
    <label>Interesse
      <select id="f-interest">
        <option value="">Tutti</option>
        <option value="yes">★ Interessante</option>
        <option value="maybe">★ Da valutare</option>
        <option value="no">★ Non mi interessa</option>
        <option value="hide">Nascondi i non interessanti</option>
      </select>
    </label>
    <label>Anno
      <span class="range"><input id="f-y1" type="number" inputmode="numeric" placeholder="da"><input id="f-y2" type="number" inputmode="numeric" placeholder="a"></span>
    </label>
    <label>BPM
      <span class="range"><input id="f-b1" type="number" inputmode="numeric" placeholder="min"><input id="f-b2" type="number" inputmode="numeric" placeholder="max"></span>
    </label>
    <label>Mixabili
      <button id="f-mix" type="button" aria-pressed="false" title="Mostra i brani con tonalità compatibile (ruota di Camelot) e BPM entro ±6% dal brano selezionato">Con il selezionato</button>
    </label>
    <div class="filters-actions"><button id="f-reset" type="button" class="ghost">Azzera</button></div>
  </section>

  <div class="pltabs" id="pltabs" hidden></div>
  <div class="bulk" id="bulk" hidden></div>

  <div class="main">
    <div class="tablebox" id="tablebox">
      <table>
        <thead><tr id="thead"></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
      <div id="empty" class="empty" hidden></div>
    </div>
    <aside class="deck" id="deck" aria-live="polite"></aside>
  </div>
  <div class="datafoot">
    <span><b>Copia di sicurezza</b> di brani, copertine, playlist e stelle:</span>
    <button id="btn-backup" type="button">Salva backup</button>
    <button id="btn-restore" type="button">Ripristina da backup</button>
    <button id="btn-covers" type="button" title="Cerca online le copertine dei brani che non ne hanno">Cerca copertine mancanti</button>
    <input id="in-backup" type="file" accept=".json,application/json" hidden>
    <span id="bk-last"></span>
  </div>
</div>
<div class="toast" id="toast" hidden></div>
<datalist id="keys"></datalist>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
window.claude = { use: async function (name) {
  if (name !== "downloads") return null;
  return { save: function (o) {
    var blob = o.data instanceof Blob ? o.data : new Blob([o.data], { type: /\.csv$/i.test(o.filename) ? "text/csv;charset=utf-8" : "application/octet-stream" });
    var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = o.filename;
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    return Promise.resolve({ status: "saved" });
  } };
} };
</script>

<script>
(function () {
  "use strict";
  var COLS = [
    { k: "title", l: "Brano", cls: "t" },
    { k: "artist", l: "Artista", cls: "tx", w: 124 },
    { k: "year", l: "Anno", cls: "mono", w: 50 },
    { k: "genre", l: "Genere", cls: "tx", w: 100 },
    { k: "bpm", l: "BPM", cls: "mono", w: 50 },
    { k: "key", l: "Key", cls: "mono", w: 50 },
    { k: "interest", l: "Interesse", cls: "c", w: 76 },
    { k: "status", l: "Stato", cls: "c", w: 112 }
  ];
  var CAMELOT = [];
  for (var n = 1; n <= 12; n++) { CAMELOT.push(n + "A"); CAMELOT.push(n + "B"); }
  var STATUS = { want: "Da comprare", have: "Comprato" };
  var LS_KEY = "crate-dj-v1";
  var INTEREST = { yes: { l: "Interessante" }, maybe: { l: "Da valutare" }, no: { l: "Non mi interessa" } };
  var INT_RANK = { yes: 0, maybe: 1, no: 2 };
  var INT_NEXT = { maybe: "yes", yes: "no", no: "maybe" };
  function interestOf(t) { return INTEREST[t.interest] ? t.interest : "maybe"; }
  function parseInterest(v) { v = String(v).toLowerCase(); if (/non|^no$|scart|rosso|red/.test(v)) return "no"; if (/^(yes|s[iì])$|inter|verde|green/.test(v)) return "yes"; return "maybe"; }
  function sortVal(t) { return sortKey === "interest" ? INT_RANK[interestOf(t)] : t[sortKey]; }

  var tracks = [];
  var selectedId = null;
  var mode = "view";          // view | edit
  var editId = null;          // null = nuovo
  var sortKey = "createdAt", sortDir = "desc";
  var mixOnly = false;
  var localAudio = {};        // id -> {url, name}  (solo finché la pagina è aperta)
  var dbCol = null;
  var checked = new Set();     // id dei brani spuntati per l'eliminazione multipla
  var bulkArm = false, bulkTimer = null;
  var delMode = false;
  var playlists = [], activePl = null, plNaming = false, plRenaming = null, plDelArm = false, plCol = null;
  var LS_PL = "crate-dj-playlists-v1", plTimer = null, LS_BK = "crate-dj-lastbackup";         // modalità eliminazione: mostra caselle e barra
  var lastDeckSig = "";
  var $ = function (id) { return document.getElementById(id); };

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function uid() { return "t" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function toast(msg) {
    var t = $("toast"); t.textContent = msg; t.hidden = false;
    clearTimeout(toast._t); toast._t = setTimeout(function () { t.hidden = true; }, 2800);
  }
  function linkify(text) {
    var re = /(https?:\/\/[^\s<>"]+|www\.[^\s<>"]+)/gi, out = "", last = 0, m;
    text = String(text == null ? "" : text);
    while ((m = re.exec(text))) {
      var raw = m[0], trail = "", tm = /[.,;:!?)\]]+$/.exec(raw);
      if (tm) { trail = tm[0]; raw = raw.slice(0, -trail.length); }
      var href = safeUrl(/^www\./i.test(raw) ? "https://" + raw : raw);
      out += esc(text.slice(last, m.index));
      out += href ? '<a href="' + esc(href) + '" target="_blank" rel="noopener noreferrer">' + esc(raw) + "</a>" + esc(trail) : esc(m[0]);
      last = m.index + m[0].length;
    }
    return out + esc(text.slice(last));
  }
  function safeUrl(u) { try { var x = new URL(u); return /^https?:$/.test(x.protocol) ? x.href : ""; } catch (e) { return ""; } }

  /* ---------- storage: db se disponibile, altrimenti localStorage ---------- */
  function lsLoad() { try { return JSON.parse(localStorage.getItem(LS_KEY) || "[]"); } catch (e) { return []; } }
  function lsSave() { try { localStorage.setItem(LS_KEY, JSON.stringify(tracks)); } catch (e) { toast("Spazio del browser pieno: esporta i dati e togli qualche copertina"); } }
  function saveTrack(t) {
    var i = tracks.findIndex(function (x) { return x.id === t.id; });
    if (dbCol) {
      var body = Object.assign({}, t); delete body.id;
      return dbCol.doc(t.id).set(body).catch(function () { toast("Salvataggio non riuscito"); });
    }
    if (i >= 0) tracks[i] = t; else tracks.push(t);
    lsSave(); renderAll(); return Promise.resolve();
  }
  function deleteTrack(id) {
    if (dbCol) return dbCol.doc(id).delete().catch(function () { toast("Eliminazione non riuscita"); });
    tracks = tracks.filter(function (x) { return x.id !== id; }); lsSave(); renderAll(); return Promise.resolve();
  }
  function onData(list) {
    tracks = list;
    checked.forEach(function (id) { if (!tracks.some(function (t) { return t.id === id; })) checked.delete(id); });
    if (selectedId && !tracks.some(function (t) { return t.id === selectedId; })) { selectedId = null; mode = "view"; }
    renderAll();
  }
  async function initStore() {
    try {
      var db = window.claude && window.claude.use ? await window.claude.use("db") : null;
      if (db) {
        dbCol = db.collection("tracks");
        plCol = db.collection("playlists");
        plCol.onSnapshot(function (snap) {
          onPlData(snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); }));
        }, function () { plCol = null; onPlData(lsPlLoad()); });
        dbCol.onSnapshot(function (snap) {
          onData(snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); }));
        }, function () { dbCol = null; onData(lsLoad()); });
        return;
      }
    } catch (e) {}
    onData(lsLoad()); onPlData(lsPlLoad());
  }

  /* ---------- tonalità / filtri ---------- */
  function parseKey(k) { var m = /^(\d{1,2})\s*([AB])$/i.exec(String(k || "").trim()); return m ? { n: +m[1], l: m[2].toUpperCase() } : null; }
  function keysCompatible(a, b) {
    var x = parseKey(a), y = parseKey(b); if (!x || !y) return false;
    if (x.n === y.n) return true;
    if (x.l !== y.l) return false;
    var d = Math.abs(x.n - y.n); return d === 1 || d === 11;
  }
  function filtered() {
    var iv = $("f-interest").value;
    var plObj = activePl ? plOf(activePl) : null;
    var q = $("f-q").value.trim().toLowerCase();
    var g = $("f-genre").value, k = $("f-key").value, s = $("f-status").value;
    var y1 = parseInt($("f-y1").value, 10), y2 = parseInt($("f-y2").value, 10);
    var b1 = parseFloat($("f-b1").value), b2 = parseFloat($("f-b2").value);
    var ref = mixOnly ? tracks.find(function (t) { return t.id === selectedId; }) : null;
    var out = tracks.filter(function (t) {

      await dl.save({ filename: "crate-dj.xlsx", data: buf });
      toast("Excel esportato (" + list.length + " brani)");
    } catch (e) { if (!e || e.code !== "declined") toast("Esportazione non riuscita"); }
  }

  /* ---------- esempi ---------- */
  function loadSamples() {
    var S = [
      ["Strobe", "deadmau5", 2009, "Progressive House", 128, "8A", "Mau5trap", "want"],
      ["Gypsy Woman (She's Homeless)", "Crystal Waters", 1991, "House", 122, "5A", "A&M", "have"],
      ["Mylo Rework Vol. 2", "Artista di esempio", 2019, "Deep House", 122, "9A", "Etichetta A", "want"],
      ["Jaded Nights", "Artista di esempio", 2021, "Deep House", 124, "8A", "Etichetta A", "want"],
      ["Midnight Circuit", "Artista di esempio", 2022, "Techno", 132, "9B", "Etichetta B", "want"],
      ["Hard Wire", "Artista di esempio", 2023, "Techno", 138, "10A", "Etichetta B", "have"],
      ["Sunset Strip", "Artista di esempio", 2018, "Nu Disco", 118, "11B", "Etichetta C", "want"],
      ["Velvet Rope", "Artista di esempio", 2017, "Nu Disco", 116, "12B", "Etichetta C", "want"],
      ["Basement Tape", "Artista di esempio", 2020, "Afro House", 123, "7A", "Etichetta D", "want"],
      ["Dust & Drum", "Artista di esempio", 2024, "Afro House", 120, "8B", "Etichetta D", "have"],
      ["Low Orbit", "Artista di esempio", 2015, "Drum & Bass", 174, "6A", "Etichetta E", "want"],
      ["Neon Tide", "Artista di esempio", 2016, "Trance", 138, "9A", "Etichetta F", "want"]
    ];
    var now = Date.now();
    S.forEach(function (s, i) {
      saveTrack({ id: uid(), createdAt: now + i, example: true, title: s[0], artist: s[1], year: s[2], genre: s[3], bpm: s[4], key: s[5], label: s[6], status: s[7] });
    });
    toast("12 brani di esempio caricati. Per eliminarli usa «Seleziona…».");
  }

  /* ---------- eventi ---------- */
  function init() {
    $("keys").innerHTML = CAMELOT.map(function (k) { return '<option value="' + k + '">'; }).join("");
    ["f-q", "f-genre", "f-key", "f-status", "f-interest", "f-y1", "f-y2", "f-b1", "f-b2"].forEach(function (id) {
      $(id).addEventListener("input", renderTable);
    });
    $("f-reset").onclick = resetFilters;
    $("f-mix").onclick = function () {
      if (!mixOnly && !selTrack()) { toast("Seleziona prima un brano nella tabella"); return; }
      mixOnly = !mixOnly; this.setAttribute("aria-pressed", mixOnly); this.classList.toggle("primary", mixOnly); renderTable();
    };
    $("thead").onclick = function (e) {
      var th = e.target.closest("th"); if (!th || !th.dataset.k) return;
      var k = th.dataset.k;
      if (sortKey === k) sortDir = sortDir === "asc" ? "desc" : "asc"; else { sortKey = k; sortDir = "asc"; }
      renderHead(); renderTable();
    };
    $("tbody").onclick = function (e) {
      var tr = e.target.closest("tr"); if (!tr) return;
      if (e.target.closest("td.chk")) {
        var cid = tr.dataset.id; if (checked.has(cid)) checked.delete(cid); else checked.add(cid);
        bulkArm = false; renderTable(); return;
      }
      if (e.target.closest(".star")) {
        var tt = tracks.find(function (x) { return x.id === tr.dataset.id; });
        if (tt) saveTrack(Object.assign({}, tt, { interest: INT_NEXT[interestOf(tt)] }));
        return;
      }
      selectedId = tr.dataset.id; mode = "view"; editId = null;
      renderTable(); renderDeck(false);
      if (window.matchMedia("(max-width: 860px)").matches) $("deck").scrollIntoView({ block: "nearest" });
    };
    $("empty").onclick = function (e) {
      var a = e.target.dataset.act; if (!a) return;
      if (a === "new") openNew(); else if (a === "samples") loadSamples(); else if (a === "reset") resetFilters();
    };
    $("btn-add").onclick = openNew;
    document.addEventListener("paste", function (e) {
      if (mode === "edit" || !selTrack()) return;
      var items = (e.clipboardData && e.clipboardData.items) || [];
      for (var i = 0; i < items.length; i++) {
        if (items[i].type.indexOf("image/") === 0) { var f = items[i].getAsFile(); if (f) { e.preventDefault(); setCover(selectedId, f); return; } }
      }
    });
    $("btn-delmode").onclick = function () { setDelMode(!delMode); };
    function doRename() {
      var cur = plOf(activePl), inp = $("pl-rename"); if (!cur || !inp) return;
      var nm = inp.value.trim();
      if (!nm) { toast("Scrivi un nome per la playlist"); return; }
      if (playlists.some(function (x) { return x.id !== cur.id && x.name.toLowerCase() === nm.toLowerCase(); })) { toast("Esiste già una playlist con questo nome"); return; }
      inp.blur(); plRenaming = null;
      plSave(Object.assign({}, cur, { name: nm })); renderPlTabs();
    }
    $("pltabs").onclick = function (e) {
      var tab = e.target.closest("[data-pl-tab]");
      if (tab) { activePl = tab.dataset.plTab || null; plNaming = false; plRenaming = null; plDelArm = false; checked.clear(); bulkArm = false; renderAll(); return; }
      var b = e.target.closest("[data-pl-act]"); if (!b) return;
      var a = b.dataset.plAct;
      if (a === "new") { plNaming = true; plRenaming = null; renderPlTabs(); }
      else if (a === "cancel") { plNaming = false; plRenaming = null; renderPlTabs(); }
      else if (a === "create") { createPlaylist($("pl-name") && $("pl-name").value, []); }
      else if (a === "rename") { plRenaming = activePl; plNaming = false; plDelArm = false; renderPlTabs(); }
      else if (a === "rename-ok") doRename();
      else if (a === "del") {
        if (!plDelArm) { plDelArm = true; clearTimeout(plTimer); plTimer = setTimeout(function () { plDelArm = false; renderPlTabs(); }, 4000); renderPlTabs(); }
        else {
          clearTimeout(plTimer); plDelArm = false;
          var nm = (plOf(activePl) || {}).name; plDelete(activePl);
          toast("Playlist «" + nm + "» eliminata. I brani restano nel database.");
        }
      }
    };
    $("pltabs").onkeydown = function (e) {
      var id = e.target.id; if (id !== "pl-name" && id !== "pl-rename") return;
      if (e.key === "Enter") { e.preventDefault(); e.target.blur(); if (id === "pl-name") createPlaylist(e.target.value, []); else doRename(); }
      else if (e.key === "Escape") { e.target.blur(); plNaming = false; plRenaming = null; renderPlTabs(); }
    };
    $("thead").onchange = function (e) {
      if (e.target.id !== "chk-all") return;
      var list = filtered(), allOn = list.length > 0 && visibleChecked(list).length === list.length;
      list.forEach(function (t) { if (allOn) checked.delete(t.id); else checked.add(t.id); });
      bulkArm = false; renderTable();
    };
    $("bulk").onclick = async function (e) {
      var b = e.target.closest("[data-bulk]"); if (!b) return;
      var a = b.dataset.bulk, list = filtered();
      if (a === "nope") { list.forEach(function (t) { if (interestOf(t) === "no") checked.add(t.id); }); bulkArm = false; renderTable(); }
      else if (a === "clear") { checked.clear(); bulkArm = false; renderTable(); }
      else if (a === "pl-add") {
        var pl = plOf($("bulk-pl") && $("bulk-pl").value), picked = visibleChecked(list).map(function (t) { return t.id; });
        if (pl && picked.length) {
          var have = {}; pl.ids.forEach(function (id) { have[id] = 1; });
          var add = picked.filter(function (id) { return !have[id]; });
          plSave(Object.assign({}, pl, { ids: pl.ids.concat(add) }));
          toast(add.length + (add.length === 1 ? " brano aggiunto" : " brani aggiunti") + " a «" + pl.name + "»" + (add.length < picked.length ? " (" + (picked.length - add.length) + (picked.length - add.length === 1 ? " già presente)" : " già presenti)") : ""));
          checked.clear(); bulkArm = false; renderTable();
        }
      }
      else if (a === "pl-new") { createPlaylist($("bulk-name").value, visibleChecked(list).map(function (t) { return t.id; })); }
      else if (a === "pl-remove") {
        var cp = plOf(activePl), gone = {}; visibleChecked(list).forEach(function (t) { gone[t.id] = 1; });
        if (cp) {
          var kept = cp.ids.filter(function (id) { return !gone[id]; });
          plSave(Object.assign({}, cp, { ids: kept }));
          var nr = cp.ids.length - kept.length; toast(nr + (nr === 1 ? " brano tolto da «" : " brani tolti da «") + cp.name + "»");
          checked.clear(); bulkArm = false; renderTable();
        }
      }
      else if (a === "del") {
        var sel = visibleChecked(list);
        if (!sel.length) return;
        if (!bulkArm) {
          bulkArm = true; clearTimeout(bulkTimer);
          bulkTimer = setTimeout(function () { bulkArm = false; renderTable(); }, 4000);
          renderTable(); return;
        }
        clearTimeout(bulkTimer); bulkArm = false;
        var ids = sel.map(function (t) { return t.id; });
        if (ids.indexOf(selectedId) >= 0) selectedId = null;
        if (mode === "edit" && ids.indexOf(editId) >= 0) { mode = "view"; editId = null; }
        for (var i = 0; i < ids.length; i++) {
          await deleteTrack(ids[i]);
          checked.delete(ids[i]);
          if (localAudio[ids[i]]) { URL.revokeObjectURL(localAudio[ids[i]].url); delete localAudio[ids[i]]; }
        }
        renderAll(); renderDeck(true);
        toast(ids.length + (ids.length === 1 ? " brano eliminato" : " brani eliminati"));
      }
    };
    $("btn-files").onclick = function () { $("in-audio").click(); };
    $("in-audio").onchange = function () { if (this.files.length) importAudioFiles(this.files); this.value = ""; };
    $("btn-import").onclick = function () { $("in-csv").click(); };
    $("in-csv").onchange = function () {
      var f = this.files[0]; this.value = ""; if (!f) return;
      var r = new FileReader();
      if (/\.xlsx?$/i.test(f.name)) {
        if (!window.XLSX) { toast("Libreria Excel non caricata: riprova o usa il CSV"); return; }
        r.onload = function () {
          try {
            var wb = XLSX.read(r.result, { type: "array" });
            var ws = wb.Sheets[wb.SheetNames[0]];
            var rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: false, defval: "" });
            importRows(rows.map(function (row) { return row.map(function (c) { return c == null ? "" : String(c); }); }));
          } catch (e) { toast("Impossibile leggere il file Excel"); }
        };
        r.readAsArrayBuffer(f);
      } else {
        r.onload = function () { importCsv(String(r.result)); }; r.readAsText(f);
      }
    };
    $("btn-export").onclick = exportCsv;
    $("btn-xlsx").onclick = exportXlsx;
    $("btn-backup").onclick = saveBackup;
    $("btn-restore").onclick = function () { $("in-backup").click(); };
    $("btn-covers").onclick = findMissingCovers;
    $("in-backup").onchange = function () {
      var f = this.files[0]; this.value = ""; if (!f) return;
      var r = new FileReader();
      r.onload = function () { try { restoreBackup(JSON.parse(String(r.result))); } catch (e) { toast("File di backup non leggibile"); } };
      r.readAsText(f);
    };
    renderBackupInfo();
    renderAll();
    initStore();
  }
  function openNew() { mode = "edit"; editId = null; renderDeck(true); if (window.matchMedia("(max-width: 860px)").matches) $("deck").scrollIntoView({ block: "nearest" }); }
  function resetFilters() {
    ["f-q", "f-genre", "f-key", "f-status", "f-interest", "f-y1", "f-y2", "f-b1", "f-b2"].forEach(function (id) { $(id).value = ""; });
    mixOnly = false; var m = $("f-mix"); m.setAttribute("aria-pressed", "false"); m.classList.remove("primary"); renderTable();
  }
  document.addEventListener("error", function (e) {
    var im = e.target;
    if (im && im.tagName === "IMG" && im.classList.contains("cov")) {
      var ph = document.createElement("span"); ph.className = im.className + " ph"; ph.textContent = "\u266a"; im.replaceWith(ph);
    }
  }, true);
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  init();
})();
</script>
</body>
</html>
